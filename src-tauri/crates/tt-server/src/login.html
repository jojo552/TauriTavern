<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>登录 · TauriTavern</title>
    <style nonce="__NONCE__">
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #111318;
            color: #edf0f5;
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
                max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        }
        main {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border: 1px solid #333844;
            border-radius: 20px;
            background: #1b1e26;
            box-shadow: 0 16px 48px #0004;
        }
        .brand { margin: 0 0 24px; color: #c5b5f3; font-weight: 650; letter-spacing: .03em; }
        h1 { margin: 0 0 10px; font-size: 1.65rem; }
        .description, .footnote { color: #b3bac9; line-height: 1.65; }
        .description { margin: 0 0 24px; }
        .footnote { margin: 24px 0 0; font-size: .85rem; }
        fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
        .field { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; }
        input:not([type="checkbox"]) {
            width: 100%;
            min-height: 46px;
            border: 1px solid #4b5363;
            border-radius: 10px;
            padding: 10px 12px;
            background: #111318;
            color: inherit;
            font: inherit;
            font-size: 16px;
        }
        .password-switch { display: flex; align-items: center; gap: 10px; min-height: 44px; margin: -8px 0 16px; }
        .password-switch input { width: 18px; height: 18px; margin: 0; accent-color: #c5b5f3; }
        button, .button-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 46px;
            padding: 11px 16px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: #c5b5f3;
            color: #1e1632;
            font: inherit;
            font-weight: 650;
            text-decoration: none;
            cursor: pointer;
        }
        .secondary { background: transparent; border-color: #596173; color: #edf0f5; margin-top: 12px; }
        button:disabled, fieldset:disabled { opacity: .6; }
        button:disabled { cursor: wait; }
        :focus-visible { outline: 3px solid #c5b5f3; outline-offset: 3px; }
        .message { margin: 20px 0 0; line-height: 1.6; overflow-wrap: anywhere; color: #b3bac9; }
        .message:empty { display: none; }
        .message[data-error="true"] { color: #ffb4b4; }
        noscript p { line-height: 1.6; color: #ffb4b4; }
        @media (max-width: 480px) { main { padding: 24px; } }
    </style>
</head>
<body data-mode="__MODE__">
    <main aria-labelledby="heading">
        <p class="brand">TauriTavern</p>
        <h1 id="heading">登录</h1>
        <p id="description" class="description">使用已配置的用户名和密码进入应用。</p>
        <form id="login-form" action="/__tt/auth/login" method="post" hidden>
            <fieldset id="login-fields" disabled>
                <div class="field">
                    <label for="username">用户名</label>
                    <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </div>
                <div class="field">
                    <label for="password">密码</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <label class="password-switch" for="show-password">
                    <input id="show-password" type="checkbox" aria-controls="password">
                    显示密码
                </label>
                <button id="login-button" type="submit">登录</button>
            </fieldset>
        </form>
        <section id="authenticated-actions" aria-label="登录状态操作" hidden>
            <a class="button-link" href="/">进入应用</a>
            <button id="logout-button" class="secondary" type="button" disabled>退出登录</button>
        </section>
        <a id="login-link" class="button-link" href="/login" hidden>前往登录</a>
        <p id="message" class="message" role="status" aria-live="polite" aria-atomic="true">正在检查登录状态…</p>
        <button id="retry-status" class="secondary" type="button" hidden>重新检查状态</button>
        <p class="footnote">仅用于访问当前 TauriTavern，不创建新账户。</p>
        <noscript><p>此页面需要 JavaScript 才能检查登录状态并安全提交。请启用后重新加载。</p></noscript>
    </main>
    <script nonce="__NONCE__">
        (() => {
            'use strict';

            const mode = document.body.dataset.mode;
            const heading = document.getElementById('heading');
            const description = document.getElementById('description');
            const form = document.getElementById('login-form');
            const fields = document.getElementById('login-fields');
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            const showPassword = document.getElementById('show-password');
            const loginButton = document.getElementById('login-button');
            const actions = document.getElementById('authenticated-actions');
            const logoutButton = document.getElementById('logout-button');
            const loginLink = document.getElementById('login-link');
            const message = document.getElementById('message');
            const retryStatus = document.getElementById('retry-status');
            let busy = false;
            let authenticated = null;

            function showMessage(text, isError = false) {
                message.textContent = text;
                message.dataset.error = String(isError);
            }

            function setBusy(value) {
                busy = value;
                fields.disabled = value;
                logoutButton.disabled = value;
                retryStatus.disabled = value;
                form.setAttribute('aria-busy', String(value));
                actions.setAttribute('aria-busy', String(value));
                loginButton.textContent = value ? '正在登录…' : '登录';
                logoutButton.textContent = value ? '正在退出…' : mode === 'logout' ? '确认退出登录' : '退出登录';
            }

            function renderState(value) {
                authenticated = value;
                form.hidden = value || mode === 'logout';
                actions.hidden = !value;
                loginLink.hidden = value || mode === 'login';
                retryStatus.hidden = true;
                heading.textContent = mode === 'logout' ? '退出登录' : value ? '已登录' : '登录';
                description.textContent = value
                    ? mode === 'logout' ? '确认退出当前浏览器的登录？关联的应用页面连接也将结束。' : '当前浏览器已登录，你可以进入应用或退出登录。'
                    : mode === 'logout' ? '当前浏览器尚未登录。' : '使用已配置的用户名和密码进入应用。';
            }

            async function readJson(response) {
                try { return await response.json(); }
                catch { return null; }
            }

            function responseError(data, fallback) {
                return typeof data?.error === 'string' && data.error.trim() ? data.error : fallback;
            }

            async function checkStatus() {
                if (busy) return;
                setBusy(true);
                showMessage('正在检查登录状态…');
                try {
                    const response = await fetch('/__tt/auth/status', { credentials: 'same-origin', cache: 'no-store' });
                    const data = await readJson(response);
                    if (!response.ok || typeof data?.authenticated !== 'boolean') {
                        showMessage('无法确认登录状态，请重新检查。', true);
                        retryStatus.hidden = false;
                        return;
                    }
                    renderState(data.authenticated);
                    showMessage('');
                } catch {
                    showMessage('网络连接失败，无法检查登录状态。请检查网络后重试。', true);
                    retryStatus.hidden = false;
                } finally {
                    setBusy(false);
                }
            }

            showPassword.addEventListener('change', () => {
                password.type = showPassword.checked ? 'text' : 'password';
            });

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                if (busy || authenticated !== false || mode !== 'login' || !form.reportValidity()) return;
                const credentials = { username: username.value, password: password.value };
                setBusy(true);
                showMessage('正在登录…');
                let navigating = false;
                try {
                    const response = await fetch('/__tt/auth/login', {
                        method: 'POST', credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(credentials),
                    });
                    const data = await readJson(response);
                    if (response.status !== 200 || data?.ok !== true) {
                        showMessage(responseError(data, '登录未成功，请稍后重试。'), true);
                        return;
                    }
                    password.value = '';
                    showMessage('登录成功，正在进入应用…');
                    location.replace('/');
                    navigating = true;
                } catch {
                    showMessage('网络连接失败，登录结果未确认。请检查网络后重试。', true);
                } finally {
                    if (!navigating) setBusy(false);
                }
            });

            logoutButton.addEventListener('click', async () => {
                if (busy || authenticated !== true) return;
                setBusy(true);
                showMessage('正在退出登录…');
                try {
                    const response = await fetch('/__tt/auth/logout', {
                        method: 'POST', credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' }, body: '{}',
                    });
                    if (response.status !== 204) {
                        showMessage(responseError(await readJson(response), '退出未成功，请稍后重试。'), true);
                        return;
                    }
                    password.value = '';
                    showPassword.checked = false;
                    password.type = 'password';
                    renderState(false);
                    showMessage('已退出登录。');
                } catch {
                    showMessage('网络连接失败，退出结果未确认。请重新检查登录状态。', true);
                    retryStatus.hidden = false;
                } finally {
                    setBusy(false);
                }
            });

            retryStatus.addEventListener('click', checkStatus);
            if (mode !== 'login' && mode !== 'logout') {
                showMessage('页面配置无效，请联系管理员。', true);
                return;
            }
            if (mode === 'logout') {
                heading.textContent = '退出登录';
                description.textContent = '正在确认当前浏览器的登录状态。';
                document.title = '退出登录 · TauriTavern';
            }
            void checkStatus();
        })();
    </script>
</body>
</html>
